<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agreement - VerifyStay</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        .contract-container { max-width: 680px; margin: 20px auto; padding: 0 16px; }
        .contract-card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        .contract-terms {
            background: #F7F8FA; border-radius: 8px; padding: 16px; margin: 16px 0;
            font-family: monospace; font-size: 13px; white-space: pre-wrap; line-height: 1.6;
        }
        .signature-block { display: flex; justify-content: space-between; gap: 16px; margin-top: 16px; }
        .signature-box { flex: 1; border-top: 2px solid #333; padding-top: 6px; font-size: 13px; }
        .signature-box .sig-name { font-family: 'Fraunces', serif; font-size: 17px; color: #0F2C59; }
        .status-pill { display: inline-block; padding: 4px 12px; border-radius: 12px; font-size: 13px; font-weight: 600; }
        .status-pending { background: #fff3e0; color: #e65100; }
        .status-accepted { background: #e8f5e9; color: #2e7d32; }
        .status-declined { background: #ffebee; color: #c62828; }
    </style>
</head>
