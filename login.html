<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up / Login - VerifyStay</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0F2C59">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <style>
        .auth-container {
            max-width: 450px;
            margin: 40px auto;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .auth-container h2 { text-align: center; margin-bottom: 8px; }
        .auth-container .subtitle { text-align: center; color: #666; margin-bottom: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: 600; }
        .form-group input, .form-group select {
            width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px;
        }
        .role-selector { display: flex; gap: 12px; margin-bottom: 16px; }
        .role-selector button {
            flex: 1; padding: 12px; border: 2px solid #ddd; border-radius: 8px;
            background: white; cursor: pointer; transition: all 0.3s;
        }
        .role-selector button.active { border-color: #0F2C59; background: #e8f0fe; color: #0F2C59; }
        .btn-full { width: 100%; padding: 14px; font-size: 18px; }
        .switch-text { text-align: center; margin-top: 16px; color: #666; }
        .switch-text a { color: #0F2C59; cursor: pointer; text-decoration: none; }
        .error-message {
            color: #d32f2f; background: #ffebee; padding: 10px; border-radius: 8px;
            margin-bottom: 16px; display: none;
        }
        .success-message {
            color: #2e7d32; background: #e8f5e9; padding: 10px; border-radius: 8px;
            margin-bottom: 16px; display: none;
        }
        .pw-toggle {
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            background: none; border: none; font-size: 18px; cursor: pointer; padding: 6px;
            line-height: 1;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <h2 style="display:flex; align-items:center; justify-content:center; gap:8px;"><svg width="30" height="30" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"><circle cx="100" cy="100" r="96" fill="#0F2C59"/><polygon points="60,96 100,58 140,96" fill="#E8C547"/><rect x="68" y="96" width="64" height="48" rx="3" fill="#F7F8FA"/><rect x="92" y="118" width="16" height="26" rx="2" fill="#0F2C59"/><circle cx="146" cy="138" r="30" fill="#C9A227" stroke="#F7F8FA" stroke-width="5"/><path d="M133,138 L143,148 L161,127" fill="none" stroke="#F7F8FA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg> VerifyStay</h2>
        <p class="subtitle">Rent Without Regret</p>

        <div id="errorMessage" class="error-message"></div>
        <div id="successMessage" class="success-message"></div>

        <div class="role-selector" id="roleSelector">
            <button type="button" class="active" data-role="tenant">👤 Tenant</button>
            <button type="button" data-role="landlord">🏠 Landlord</button>
            <button type="button" data-role="agent">🤝 Agent</button>
        </div>

        <form id="authForm">
            <div id="signupFields">
                <div class="form-group">
                    <label>Full Name *</label>
                    <input type="text" id="fullName" placeholder="Enter your full name">
                </div>
                <div class="form-group">
                    <label>Phone Number *</label>
                    <input type="tel" id="phone" placeholder="080xxxxxxxx">
                    <small style="color:#666;display:block;margin-top:4px;">We'll call to confirm this number as part of your account review — no code needed now.</small>
                </div>
            </div>

            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="you@email.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div style="position:relative;">
                    <input type="password" id="password" placeholder="Minimum 6 characters" required style="padding-right:44px;">
                    <button type="button" class="pw-toggle" data-target="password" aria-label="Show password">👁️</button>
                </div>
            </div>
            <div class="form-group" id="confirmPasswordGroup">
                <label>Confirm Password *</label>
                <div style="position:relative;">
                    <input type="password" id="confirmPassword" placeholder="Re-enter your password" style="padding-right:44px;">
                    <button type="button" class="pw-toggle" data-target="confirmPassword" aria-label="Show password">👁️</button>
                </div>
                <small id="pwMatchStatus" style="display:block;margin-top:4px;"></small>
            </div>

            <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
                Sign Up
            </button>
        </form>


        <p class="switch-text">
            <span id="toggleText">Already have an account?</span>
            <a id="toggleLink">Login</a>
        </p>
    </div>

    <!-- Firebase SDKs (compat) — must load before firebase-config.js on EVERY page -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="login.js"></script>
    <script src="pwa-register.js"></script>
</body>
</html>
