    <meta charset="UTF-8">

    <style>
        .notif-container { max-width: 640px; margin: 20px auto; padding: 0 16px; }
        .notif-item {
            display: flex; align-items: flex-start; gap: 12px; padding: 14px;
            background: #fff; border-radius: 10px; margin-bottom: 8px;
            box-shadow: 0 1px 6px rgba(0,0,0,0.06); text-decoration: none; color: inherit;
        }
        .notif-item.unread { border-left: 4px solid #C9A227; }
        .notif-item .icon { font-size: 20px; flex-shrink: 0; }
        .notif-item .body { flex: 1; }
        .notif-item .time { font-size: 12px; color: #999; margin-top: 2px; }
